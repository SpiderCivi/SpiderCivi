<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140">
  <defs>
    <linearGradient id="crtGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00b32d"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="760" height="140" fill="#050805"/>
  <rect width="760" height="140" fill="#001a05"/>

  <text x="380" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="46"
        font-weight="bold" fill="url(#crtGlow)" filter="url(#glowBlur)" letter-spacing="6">
    SPIDERCIVI
    <animate attributeName="opacity" values="1;0.82;1;1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <text x="380" y="104" text-anchor="middle" font-family="'Courier New', monospace" font-size="15"
        fill="#00ff41" opacity="0.85" letter-spacing="2">
    root@spidercivi:~$ <tspan fill="#7CFF9C">whoami</tspan>
    <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <rect x="345" y="112" width="10" height="16" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect width="760" height="140" fill="url(#scanlines)"/>
  <rect width="760" height="140" fill="none" stroke="#00ff41" stroke-opacity="0.25" stroke-width="2"/>
</svg>
