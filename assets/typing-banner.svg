<svg xmlns="http://www.w3.org/2000/svg" width="760" height="90" viewBox="0 0 760 90">
  <defs>
    <linearGradient id="typeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00b32d"/>
    </linearGradient>
    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;520;520;0;0" keyTimes="0;0.35;0.55;0.6;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="760" height="90" fill="#050805"/>
  <rect width="760" height="90" fill="none" stroke="#00ff41" stroke-opacity="0.25" stroke-width="2"/>

  <text x="20" y="52" font-family="'Courier New', monospace" font-size="26" fill="#4b6b52">$</text>

  <g clip-path="url(#revealClip)">
    <text x="42" y="52" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="url(#typeGlow)">
      SpiderCivi — builder &amp; security tinkerer
    </text>
  </g>

  <rect x="42" y="30" width="12" height="26" fill="#00ff41">
    <animateTransform attributeName="transform" type="translate" values="0,0;520,0;520,0;0,0;0,0" keyTimes="0;0.35;0.55;0.6;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
